<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LSEMS Forum Poster</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="dot"></span>
      <div class="titles">
        <h1>LSEMS Forum Poster</h1>
        <p id="version">v1.0.0</p>
      </div>
    </header>

    <section id="empty" class="empty" hidden>
      <p>Nothing prepared yet.</p>
      <p class="hint">
        Press a <em>Copy &amp; Open</em> button in the LSEMS app, then open the GOV
        posting page and press <em>Fill</em> on the bar in its corner.
      </p>
    </section>

    <section id="saved" hidden>
      <p class="label">Prepared post</p>
      <p id="feature" class="feature"></p>
      <div class="row"><span class="key">Title</span><span id="subject" class="val"></span></div>
      <div class="row"><span class="key">Target</span><span id="target" class="val"></span></div>
      <div class="row" id="recipientRow" hidden>
        <span class="key">To</span><span id="recipient" class="val"></span>
      </div>
      <pre id="preview"></pre>
      <div class="actions">
        <button id="open" class="primary">Open posting page</button>
        <button id="copy">Copy BBCode</button>
        <button id="clear">Clear</button>
      </div>
    </section>

    <p id="status" class="status"></p>

    <footer class="credit">
      Developed by <strong>@fulcain</strong>
    </footer>

    <script src="../src/shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
